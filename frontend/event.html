<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Leaderboard - Wikimedia Live Leaderboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <style>
        .form-group { margin-bottom: 1rem; text-align: left; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--text-muted); font-size: 0.9rem; }
        .form-group input { width: 100%; }
        #editEventFormContainer {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 1.5rem;
            margin-top: 1rem;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="container" style="position: relative; z-index: 10;">
        <div style="margin-bottom: 20px;">
            <a href="/" class="btn" style="text-decoration: none; background: rgba(255,255,255,0.1);">&larr; Back to Events</a>
        </div>
        
        <header class="glass-panel main-header" style="flex-wrap: wrap; gap: 20px;">
            <div class="logo-area">
                <img src="https://upload.wikimedia.org/wikipedia/commons/3/32/Dhaka_Wikimedia_Community_logo-vertical-en.svg" alt="Logo" class="logo" style="width: 40px; height: 40px;">
                <div>
                    <h1 id="eventName">Loading Event...</h1>
                    <p class="subtitle" id="eventDesc">Tracking contributions in real-time | UTC+6</p>
                </div>
            </div>
            
            <div class="admin-panel hidden" id="adminPanel" style="flex-wrap: wrap;">
                <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; width: 100%;">
                    <input type="text" id="editorInput" placeholder="Enter Wikimedia Username..." />
                    <button id="addEditorBtn" class="btn">Add Editor</button>
                    <button id="toggleEditFormBtn" class="btn" style="background: var(--accent-green);">Edit Settings</button>
                </div>
                
                <div id="editEventFormContainer" class="hidden">
                    <h3 style="margin-bottom: 1rem;">Edit Event Settings</h3>
                    <form id="editEventForm">
                        <div class="form-group">
                            <label>Event Name</label>
                            <input type="text" id="evName" required>
                        </div>
                        <div class="form-group">
                            <label>URL Slug (Change will break old links!)</label>
                            <input type="text" id="evSlug" required pattern="[a-zA-Z0-9\-]+">
                        </div>
                        <div class="form-group">
                            <label>Target Wikis (comma separated)</label>
                            <input type="text" id="evWikis" required>
                        </div>
                        <div class="form-group">
                            <label>Start Time (Your Local Time)</label>
                            <input type="datetime-local" id="evStart" required>
                        </div>
                        <div class="form-group">
                            <label>End Time (Your Local Time)</label>
                            <input type="datetime-local" id="evEnd" required>
                        </div>
                        <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                            <button type="submit" class="btn" style="background: var(--primary);">Save Changes</button>
                            <button type="button" class="btn" style="background: #ef4444;" onclick="document.getElementById('editEventFormContainer').classList.add('hidden')">Cancel</button>
                        </div>
                        <div id="formMessage" style="margin-top: 10px; color: #ef4444; font-size: 0.9rem;"></div>
                    </form>
                </div>
            </div>
        </header>

        <section class="stats-grid">
            <div class="glass-panel stat-card">
                <h3>Total Edits</h3>
                <div class="stat-value" id="stat-edits">0</div>
            </div>
            <div class="glass-panel stat-card">
                <h3>Editors</h3>
                <div class="stat-value" id="stat-editors">0</div>
            </div>
            <div class="glass-panel stat-card">
                <h3>File Uploads</h3>
                <div class="stat-value" id="stat-uploads">0</div>
            </div>
            <div class="glass-panel stat-card">
                <h3>Bytes Added</h3>
                <div class="stat-value" id="stat-bytes">0</div>
            </div>
        </section>

        <main class="glass-panel leaderboard-section">
            <div class="leaderboard-header">
                <h2>Leaderboard</h2>
                <div class="live-indicator" style="display: flex; align-items: center; gap: 10px;">
                    <div><span class="dot"></span> Updates every 5 minutes</div>
                    <button id="refreshBtn" class="primary-btn" style="padding: 4px 12px; font-size: 0.8rem; min-width: 100px;">Refresh Now</button>
                </div>
            </div>
            
            <div class="table-container">
                <table id="leaderboardTable">
                    <thead>
                        <tr id="tableHeaders">
                            <th>Rank</th>
                            <th>Editor</th>
                            <th>Total Edits</th>
                            <th>File Uploads</th>
                            <th>Bytes Added</th>
                            <!-- Actions injected by JS to avoid CSS caching issues -->
                        </tr>
                    </thead>
                    <tbody id="leaderboardBody">
                        <tr><td colspan="5" style="text-align:center;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast glass-panel hidden"></div>

    <script>
        let slug = window.location.pathname.split('/').pop();
        let currentUser = null;
        let eventData = null;
        let isAdmin = false;
        let headersInjected = false;
        
        const POLL_INTERVAL = 30000;
        
        // Formatter
        const formatNum = (num) => new Intl.NumberFormat().format(num);
        const formatBytes = (bytes) => {
            if (bytes === 0) return '0 B';
            const sign = bytes < 0 ? '-' : '+';
            bytes = Math.abs(bytes);
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return `${sign} ${parseFloat((bytes / Math.pow(k, i)).toFixed(1))} ${sizes[i]}`;
        };

        const toast = document.getElementById('toast');
        const showToast = (message, isError = false) => {
            toast.textContent = message;
            toast.style.borderLeftColor = isError ? '#ef4444' : 'var(--accent-green)';
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.classList.add('hidden'), 300);
            }, 3000);
        };

        // Format ISO UTC to local datetime-local string
        function toLocalDatetimeString(isoString) {
            const date = new Date(isoString);
            const tzOffset = date.getTimezoneOffset() * 60000;
            const localISOTime = (new Date(date.getTime() - tzOffset)).toISOString().slice(0, 16);
            return localISOTime;
        }

        async function init() {
            try {
                const meRes = await fetch('/api/me');
                if (meRes.ok) {
                    currentUser = await meRes.json();
                }
            } catch(e) {}

            await fetchLiveStats();
            setInterval(fetchLiveStats, POLL_INTERVAL);
        }

        async function fetchLiveStats() {
            try {
                const res = await fetch(`/api/events/${slug}/live-stats`);
                if (!res.ok) throw new Error("Failed to fetch event data");
                const data = await res.json();
                
                eventData = data.event;
                
                if (currentUser && (currentUser.role === 'superadmin' || currentUser.username === eventData.creator_username)) {
                    isAdmin = true;
                    document.getElementById('adminPanel').classList.remove('hidden');
                    
                    // Bulletproof way to hide/show actions header without relying on CSS
                    if (!headersInjected) {
                        const tr = document.getElementById('tableHeaders');
                        const th = document.createElement('th');
                        th.textContent = 'Actions';
                        tr.appendChild(th);
                        headersInjected = true;
                    }

                    // Populate edit form
                    if (document.getElementById('editEventFormContainer').classList.contains('hidden')) {
                        document.getElementById('evName').value = eventData.name;
                        document.getElementById('evSlug').value = eventData.slug;
                        document.getElementById('evWikis').value = eventData.target_wikis;
                        document.getElementById('evStart').value = toLocalDatetimeString(eventData.start_time);
                        document.getElementById('evEnd').value = toLocalDatetimeString(eventData.end_time);
                    }
                }

                // Update UI Headers
                document.getElementById('eventName').textContent = eventData.name;
                document.getElementById('eventDesc').textContent = `${eventData.description || 'Live Leaderboard'} | Target: ${eventData.target_wikis} | By: ${eventData.creator_username}`;

                // Update Stats
                document.getElementById('stat-edits').textContent = formatNum(data.global_stats.total_edits);
                document.getElementById('stat-editors').textContent = formatNum(data.global_stats.total_editors);
                document.getElementById('stat-uploads').textContent = formatNum(data.global_stats.total_uploads);
                document.getElementById('stat-bytes').textContent = formatBytes(data.global_stats.bytes_added);

                // Render Table
                const tbody = document.getElementById('leaderboardBody');
                tbody.innerHTML = '';
                if(data.leaderboard.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="${isAdmin ? 6 : 5}" style="text-align: center;">No editors participating yet.</td></tr>`;
                    return;
                }

                data.leaderboard.forEach(entry => {
                    const row = document.createElement('tr');
                    if(entry.rank <= 3) row.classList.add(`rank-${entry.rank}`);
                    
                    let rowHtml = `
                        <td>#${entry.rank}</td>
                        <td><a href="https://meta.wikimedia.org/wiki/User:${encodeURIComponent(entry.username)}" target="_blank" style="color: var(--primary); text-decoration: none; font-weight: 600;">${entry.username}</a></td>
                        <td>${formatNum(entry.total_edits)}</td>
                        <td>${formatNum(entry.file_uploads)}</td>
                        <td style="color: var(--accent-green)">${formatBytes(entry.bytes_changed)}</td>
                    `;
                    
                    if (isAdmin) {
                        rowHtml += `<td><button onclick="removeEditor('${entry.username}')" style="background:#ef4444; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">Remove</button></td>`;
                    }
                    
                    row.innerHTML = rowHtml;
                    tbody.appendChild(row);
                });

            } catch (e) {
                console.error(e);
                showToast("Failed to load event data", true);
            }
        }

        // Toggle Edit Form
        document.getElementById('toggleEditFormBtn').addEventListener('click', () => {
            const form = document.getElementById('editEventFormContainer');
            if (form.classList.contains('hidden')) {
                form.classList.remove('hidden');
            } else {
                form.classList.add('hidden');
            }
        });

        // Submit Edit Form
        document.getElementById('editEventForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('formMessage');
            msg.textContent = '';
            
            const startLocal = document.getElementById('evStart').value;
            const endLocal = document.getElementById('evEnd').value;
            
            const newSlug = document.getElementById('evSlug').value.toLowerCase();
            
            const payload = {
                name: document.getElementById('evName').value,
                slug: newSlug,
                target_wikis: document.getElementById('evWikis').value,
                start_time: new Date(startLocal).toISOString(),
                end_time: new Date(endLocal).toISOString(),
                description: eventData.description // Preserve existing description
            };

            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.textContent = "Saving...";

            try {
                const res = await fetch(`/api/events/${slug}`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail);
                
                showToast(`Event updated successfully!`);
                document.getElementById('editEventFormContainer').classList.add('hidden');
                
                if (newSlug !== slug) {
                    // Redirect if slug changed
                    window.location.href = `/event/${newSlug}`;
                } else {
                    await fetchLiveStats();
                }
            } catch(err) {
                msg.textContent = err.message;
            } finally {
                btn.disabled = false;
                btn.textContent = "Save Changes";
            }
        });

        // Add Editor
        document.getElementById('addEditorBtn').addEventListener('click', async () => {
            const input = document.getElementById('editorInput');
            const username = input.value.trim();
            if (!username) return;

            const btn = document.getElementById('addEditorBtn');
            btn.disabled = true;
            btn.textContent = 'Adding...';

            try {
                const res = await fetch(`/api/events/${slug}/editors`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username})
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail);
                
                showToast(`Added ${username}!`);
                input.value = '';
                await fetchLiveStats();
            } catch(e) {
                showToast(e.message, true);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Add Editor';
            }
        });

        // Remove Editor
        window.removeEditor = async (username) => {
            if(!confirm(`Remove ${username} from this event?`)) return;
            try {
                const res = await fetch(`/api/events/${slug}/editors/${username}`, {method: 'DELETE'});
                if(!res.ok) throw new Error("Failed to remove");
                showToast(`Removed ${username}`);
                await fetchLiveStats();
            } catch(e) {
                showToast(e.message, true);
            }
        };

        // Refresh
        document.getElementById('refreshBtn').addEventListener('click', async () => {
            const btn = document.getElementById('refreshBtn');
            btn.disabled = true;
            btn.textContent = 'Refreshing...';
            try {
                await fetch(`/api/events/${slug}/refresh`, {method: 'POST'});
                await fetchLiveStats();
            } catch(e) {
                console.error(e);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Refresh Now';
            }
        });

        init();
    </script>
</body>
</html>
