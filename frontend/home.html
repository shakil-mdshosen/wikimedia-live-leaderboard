<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wikimedia Live Leaderboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <style>
        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        .event-card {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease;
        }
        .event-card:hover {
            transform: translateY(-5px);
        }
    </style>
</head>
<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="container" style="position: relative; z-index: 10;">
        <header class="glass-panel main-header" style="flex-wrap: wrap; gap: 20px;">
            <div class="logo-area">
                <img src="https://upload.wikimedia.org/wikipedia/commons/3/32/Dhaka_Wikimedia_Community_logo-vertical-en.svg" alt="Logo" class="logo" style="width: 40px; height: 40px;">
                <div>
                    <h1 class="title">Wikimedia Live Leaderboard</h1>
                    <p class="subtitle">Track edit-a-thons in real-time across the Wikimedia ecosystem</p>
                </div>
            </div>
            <div id="auth-section" class="admin-panel">
                <a href="/oauth/login" class="btn" style="text-decoration: none;">Login with Wikimedia</a>
            </div>
        </header>

        <main class="glass-panel" style="padding: 2rem; margin-bottom: 2rem;">
            <h2 style="margin-bottom: 20px; font-size: 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;">Active Events</h2>
            <div id="eventsList" class="events-grid">
                <!-- Events populated here -->
            </div>
        </main>
        
        <footer style="text-align: center; color: var(--text-muted); font-size: 0.9rem; padding: 1rem 0; margin-bottom: 2rem;">
            Created by <a href="https://meta.wikimedia.org/wiki/User:MdsShakil" target="_blank" style="color: var(--primary); text-decoration: none;">Shakil Hosen</a>. 
            Source code available on <a href="https://github.com/shakil-mdshosen/wikimedia-live-leaderboard" target="_blank" style="color: var(--primary); text-decoration: none;">GitHub</a>.
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Check auth
            try {
                const meRes = await fetch('/api/me');
                if (meRes.ok) {
                    const me = await meRes.json();
                    document.getElementById('auth-section').innerHTML = `
                        <span style="color: var(--text-muted); display:flex; align-items:center;">Welcome, ${me.username}</span>
                        <a href="/dashboard" class="btn" style="text-decoration: none; background: rgba(255,255,255,0.1);">Dashboard</a>
                        <button onclick="logout()" class="btn" style="background: #ef4444;">Logout</button>
                    `;
                }
            } catch (e) {}

            // Load events
            try {
                const res = await fetch('/api/events');
                const events = await res.json();
                const list = document.getElementById('eventsList');
                
                if (events.length === 0) {
                    list.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 2rem;">No active events right now.</div>';
                    return;
                }
                
                let html = '';
                events.forEach(e => {
                    const start = new Date(e.start_time).toLocaleDateString(undefined, {month: 'short', day: 'numeric', year: 'numeric'});
                    const end = new Date(e.end_time).toLocaleDateString(undefined, {month: 'short', day: 'numeric', year: 'numeric'});
                    html += `
                        <div class="glass-panel event-card">
                            <div>
                                <h3 style="margin-bottom: 10px;"><a href="/event/${e.slug}" style="color: var(--text-main); text-decoration: none; font-size: 1.2rem;">${e.name}</a></h3>
                                <p style="color: var(--primary); font-size: 0.9rem; margin-bottom: 15px;">${start} — ${end}</p>
                                <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px;">By ${e.creator_username}</p>
                            </div>
                            <a href="/event/${e.slug}" class="btn" style="text-decoration: none; text-align: center; width: 100%;">View Leaderboard</a>
                        </div>
                    `;
                });
                list.innerHTML = html;
            } catch(e) {
                console.error(e);
            }
        });

        async function logout() {
            await fetch('/oauth/logout', {method: 'POST'});
            window.location.reload();
        }
    </script>
</body>
</html>
