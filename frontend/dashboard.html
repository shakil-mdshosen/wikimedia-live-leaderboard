<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Wikimedia Live Leaderboard</title>
    <link rel="stylesheet" href="/index.css">
    <style>
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: var(--text-color); }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-darker); color: var(--text-color); }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-container">
            <div style="display: flex; align-items: center; gap: 15px;">
                <img src="https://upload.wikimedia.org/wikipedia/commons/3/32/Dhaka_Wikimedia_Community_logo-vertical-en.svg" alt="Logo" class="logo">
                <h1 class="title"><a href="/" style="color: inherit; text-decoration: none;">Wikimedia Live Leaderboard</a></h1>
            </div>
            <div>
                <a href="/" class="secondary-btn" style="text-decoration: none; margin-right: 10px;">Home</a>
                <button onclick="logout()" class="secondary-btn">Logout</button>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
            <div>
                <h2 style="margin-bottom: 20px;">My Events</h2>
                <div id="myEventsList" style="display: grid; gap: 15px;">
                    <!-- User events -->
                </div>
            </div>
            
            <div>
                <div class="card">
                    <h2 style="margin-bottom: 20px; margin-top: 0;">Create New Event</h2>
                    <form id="createEventForm">
                        <div class="form-group">
                            <label>Event Name</label>
                            <input type="text" id="evName" required placeholder="e.g., Dhaka Edit-a-thon 2026">
                        </div>
                        <div class="form-group">
                            <label>URL Slug</label>
                            <input type="text" id="evSlug" required placeholder="dhaka-2026" pattern="[a-zA-Z0-9\-]+">
                        </div>
                        <div class="form-group">
                            <label>Target Wikis (comma separated)</label>
                            <input type="text" id="evWikis" required value="commons.wikimedia.org, bn.wikipedia.org">
                        </div>
                        <div class="form-group">
                            <label>Start Time (UTC)</label>
                            <input type="datetime-local" id="evStart" required>
                        </div>
                        <div class="form-group">
                            <label>End Time (UTC)</label>
                            <input type="datetime-local" id="evEnd" required>
                        </div>
                        <button type="submit" class="primary-btn" style="width: 100%;">Create Event</button>
                        <div id="formMessage" style="margin-top: 10px; color: #ef4444;"></div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script>
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', async () => {
            // Check auth
            try {
                const meRes = await fetch('/api/me');
                if (!meRes.ok) {
                    window.location.href = '/';
                    return;
                }
                currentUser = await meRes.json();
            } catch (e) {
                window.location.href = '/';
                return;
            }

            loadMyEvents();

            document.getElementById('createEventForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const msg = document.getElementById('formMessage');
                msg.textContent = '';
                
                // Construct Date objects explicitly (the input uses local time visually, but we need to send UTC ISO string)
                // Browsers datetime-local lacks timezone, so we assume the user enters their local time, and we convert to ISO.
                const startLocal = document.getElementById('evStart').value;
                const endLocal = document.getElementById('evEnd').value;
                
                const payload = {
                    name: document.getElementById('evName').value,
                    slug: document.getElementById('evSlug').value.toLowerCase(),
                    target_wikis: document.getElementById('evWikis').value,
                    start_time: new Date(startLocal).toISOString(),
                    end_time: new Date(endLocal).toISOString()
                };

                try {
                    const res = await fetch('/api/events', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail);
                    
                    document.getElementById('createEventForm').reset();
                    loadMyEvents();
                } catch(err) {
                    msg.textContent = err.message;
                }
            });
        });

        async function loadMyEvents() {
            try {
                const res = await fetch('/api/events');
                const allEvents = await res.json();
                
                // Filter by creator, unless superadmin
                const myEvents = currentUser.role === 'superadmin' 
                    ? allEvents 
                    : allEvents.filter(e => e.creator_username === currentUser.username);

                const list = document.getElementById('myEventsList');
                if (myEvents.length === 0) {
                    list.innerHTML = '<p style="color: var(--text-muted)">You have not created any events yet.</p>';
                    return;
                }

                let html = '';
                myEvents.forEach(e => {
                    html += `
                        <div class="card" style="padding: 15px;">
                            <h3 style="margin: 0 0 5px 0;"><a href="/event/${e.slug}" style="color: var(--primary); text-decoration: none;">${e.name}</a></h3>
                            <p style="margin: 0 0 10px 0; color: var(--text-muted); font-size: 0.85rem;">Slug: /event/${e.slug}</p>
                            <div style="display: flex; gap: 10px;">
                                <a href="/event/${e.slug}" class="secondary-btn" style="text-decoration: none; padding: 4px 8px; font-size: 0.8rem;">Manage Event</a>
                                <button onclick="deleteEvent('${e.slug}')" style="background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.8rem;">Delete</button>
                            </div>
                        </div>
                    `;
                });
                list.innerHTML = html;
            } catch(e) {
                console.error(e);
            }
        }

        async function deleteEvent(slug) {
            if(!confirm("Are you sure you want to delete this event? This cannot be undone.")) return;
            try {
                await fetch('/api/events/' + slug, { method: 'DELETE' });
                loadMyEvents();
            } catch(e) {
                alert("Failed to delete");
            }
        }

        async function logout() {
            await fetch('/oauth/logout', {method: 'POST'});
            window.location.href = '/';
        }
    </script>
</body>
</html>
