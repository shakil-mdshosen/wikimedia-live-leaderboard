<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Wikimedia Live Leaderboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <style>
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--text-muted); font-size: 0.9rem; }
        .form-group input { width: 100%; }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }
        @media (min-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="container" style="position: relative; z-index: 10;">
        <header class="glass-panel main-header" style="flex-wrap: wrap; gap: 20px;">
            <div class="logo-area">
                <img src="https://upload.wikimedia.org/wikipedia/commons/3/32/Dhaka_Wikimedia_Community_logo-vertical-en.svg" alt="Logo" class="logo" style="width: 40px; height: 40px;">
                <div>
                    <h1 class="title"><a href="/" style="color: inherit; text-decoration: none;">Wikimedia Live Leaderboard</a></h1>
                    <p class="subtitle" id="dashboard-subtitle">Loading...</p>
                </div>
            </div>
            <div class="admin-panel">
                <a href="/" class="btn" style="text-decoration: none; background: rgba(255,255,255,0.1);">Home</a>
                <button onclick="logout()" class="btn" style="background: #ef4444;">Logout</button>
            </div>
        </header>

        <main class="dashboard-grid">
            <div class="glass-panel" style="padding: 2rem;">
                <h2 style="margin-bottom: 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;">All Events</h2>
                <div id="myEventsList" style="display: grid; gap: 1rem;">
                    <!-- User events -->
                </div>
            </div>
            
            <div class="glass-panel" style="padding: 2rem;">
                <h2 style="margin-bottom: 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;">Create New Event</h2>
                <form id="createEventForm">
                    <div class="form-group">
                        <label>Event Name</label>
                        <input type="text" id="evName" required placeholder="e.g., Dhaka Edit-a-thon 2026">
                    </div>
                    <div class="form-group">
                        <label>URL Slug (e.g. /event/dhaka-2026)</label>
                        <input type="text" id="evSlug" required placeholder="dhaka-2026" pattern="[a-zA-Z0-9\-]+">
                    </div>
                    <div class="form-group">
                        <label>Target Wikis (comma separated)</label>
                        <input type="text" id="evWikis" required value="commons.wikimedia.org, bn.wikipedia.org">
                    </div>
                    <div class="form-group">
                        <label>Start Time (Your Local Time)</label>
                        <input type="datetime-local" id="evStart" required>
                    </div>
                    <div class="form-group">
                        <label>End Time (Your Local Time)</label>
                        <input type="datetime-local" id="evEnd" required>
                    </div>
                    <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Create Event</button>
                    <div id="formMessage" style="margin-top: 10px; color: #ef4444; font-size: 0.9rem;"></div>
                </form>
            </div>
        </main>
        
        <footer style="text-align: center; color: var(--text-muted); font-size: 0.9rem; padding: 1rem 0; margin-bottom: 2rem;">
            Created by <a href="https://meta.wikimedia.org/wiki/User:MdsShakil" target="_blank" style="color: var(--primary); text-decoration: none;">Shakil Hosen</a>. 
            Source code available on <a href="https://github.com/shakil-mdshosen/wikimedia-live-leaderboard" target="_blank" style="color: var(--primary); text-decoration: none;">GitHub</a>.
        </footer>
    </div>

    <script>
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const meRes = await fetch('/api/me');
                if (!meRes.ok) throw new Error();
                currentUser = await meRes.json();
                document.getElementById('dashboard-subtitle').textContent = `Dashboard | ${currentUser.role === 'superadmin' ? 'Superadmin' : 'Event Organizer'}`;
            } catch (e) {
                window.location.href = '/';
                return;
            }

            loadMyEvents();

            document.getElementById('createEventForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const msg = document.getElementById('formMessage');
                msg.textContent = '';
                
                const startLocal = document.getElementById('evStart').value;
                const endLocal = document.getElementById('evEnd').value;
                
                const payload = {
                    name: document.getElementById('evName').value,
                    slug: document.getElementById('evSlug').value.toLowerCase(),
                    target_wikis: document.getElementById('evWikis').value,
                    start_time: new Date(startLocal + '+06:00').toISOString(),
                    end_time: new Date(endLocal + '+06:00').toISOString()
                };

                const btn = e.target.querySelector('button[type="submit"]');
                btn.disabled = true;
                btn.textContent = "Creating...";

                try {
                    const res = await fetch('/api/events', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail);
                    
                    document.getElementById('createEventForm').reset();
                    loadMyEvents();
                } catch(err) {
                    msg.textContent = err.message;
                } finally {
                    btn.disabled = false;
                    btn.textContent = "Create Event";
                }
            });
        });

        async function loadMyEvents() {
            try {
                const res = await fetch('/api/events');
                const allEvents = await res.json();
                
                const list = document.getElementById('myEventsList');
                if (allEvents.length === 0) {
                    list.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 2rem;">No events available.</p>';
                    return;
                }

                let html = '';
                allEvents.forEach(e => {
                    const canEdit = currentUser.role === 'superadmin' || e.creator_username === currentUser.username;
                    
                    html += `
                        <div style="background: rgba(0,0,0,0.2); padding: 1rem; border-radius: 8px; border: 1px solid var(--glass-border);">
                            <h3 style="margin: 0 0 5px 0;"><a href="/event/${e.slug}" style="color: var(--text-main); text-decoration: none;">${e.name}</a></h3>
                            <p style="margin: 0 0 15px 0; color: var(--primary); font-size: 0.85rem;">/event/${e.slug} <span style="color: var(--text-muted);">(By ${e.creator_username})</span></p>
                            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                                <a href="/event/${e.slug}" class="btn" style="text-decoration: none; padding: 4px 12px; font-size: 0.8rem; background: rgba(255,255,255,0.1);">View Leaderboard</a>
                    `;
                    
                    if (canEdit) {
                        html += `
                                <a href="/event/${e.slug}/edit" class="btn" style="text-decoration: none; padding: 4px 12px; font-size: 0.8rem; background: var(--accent-green);">Edit / Manage</a>
                                <button onclick="deleteEvent('${e.slug}')" class="btn" style="background: #ef4444; padding: 4px 12px; font-size: 0.8rem;">Delete</button>
                        `;
                    }
                    
                    html += `
                            </div>
                        </div>
                    `;
                });
                list.innerHTML = html;
            } catch(e) {
                console.error(e);
            }
        }

        async function deleteEvent(slug) {
            if(!confirm("Are you sure you want to delete this event? This cannot be undone.")) return;
            try {
                await fetch('/api/events/' + slug, { method: 'DELETE' });
                loadMyEvents();
            } catch(e) {
                alert("Failed to delete");
            }
        }

        async function logout() {
            await fetch('/oauth/logout', {method: 'POST'});
            window.location.href = '/';
        }
    </script>
</body>
</html>
